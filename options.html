<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChatGPT TOC 設定</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="options-shell">
      <header class="options-header">
        <h1>ChatGPT TOC</h1>
        <p>設定問題清單的顯示方式</p>
      </header>

      <section class="setting-group" aria-labelledby="sidebar-mode-title">
        <h2 id="sidebar-mode-title">Sidebar 顯示模式</h2>
        <label>
          <input type="radio" name="sidebarMode" value="expanded">
          <span>固定展開</span>
        </label>
        <label>
          <input type="radio" name="sidebarMode" value="tab">
          <span>小標籤模式</span>
        </label>
      </section>

      <section class="setting-group" aria-labelledby="sidebar-position-title">
        <h2 id="sidebar-position-title">Sidebar 位置</h2>
        <label>
          <input type="radio" name="sidebarPosition" value="right">
          <span>右側</span>
        </label>
        <label>
          <input type="radio" name="sidebarPosition" value="left">
          <span>左側</span>
        </label>
      </section>

      <section class="setting-group" aria-labelledby="appearance-title">
        <h2 id="appearance-title">外觀</h2>
        <label>
          <input type="radio" name="appearance" value="system">
          <span>跟隨系統</span>
        </label>
        <label>
          <input type="radio" name="appearance" value="light">
          <span>淺色</span>
        </label>
        <label>
          <input type="radio" name="appearance" value="dark">
          <span>深色</span>
        </label>
      </section>

      <section class="setting-group" aria-labelledby="question-sort-title">
        <h2 id="question-sort-title">問題排序</h2>
        <label>
          <input type="radio" name="questionSort" value="oldest">
          <span>由舊到新</span>
        </label>
        <label>
          <input type="radio" name="questionSort" value="newest">
          <span>由新到舊</span>
        </label>
      </section>

      <section class="setting-group" aria-labelledby="font-size-title">
        <h2 id="font-size-title">字體大小</h2>
        <label>
          <input type="radio" name="listFontSize" value="small">
          <span>小</span>
        </label>
        <label>
          <input type="radio" name="listFontSize" value="medium">
          <span>中</span>
        </label>
        <label>
          <input type="radio" name="listFontSize" value="large">
          <span>大</span>
        </label>
      </section>

      <section class="setting-group" aria-labelledby="background-opacity-title">
        <div class="setting-heading-row">
          <h2 id="background-opacity-title">背景透明度</h2>
          <output id="background-opacity-value" for="background-opacity">100%</output>
        </div>
        <input
          id="background-opacity"
          class="range-input"
          type="range"
          name="backgroundOpacity"
          min="30"
          max="100"
          step="5"
        >
      </section>

      <p class="save-status" role="status" aria-live="polite"></p>
    </main>

    <script src="options.js"></script>
  </body>
</html>
